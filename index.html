<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000055">
<title>Henry IELTS Speaking</title>
<style>
:root{
  --navy:#000055;
  --orange:#FF6600;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#11132b;
  --muted:#6b7280;
  --line:#e5e7eb;
  --success:#108a52;
  --danger:#c13b3b;
  --warning:#b66a00;
  --shadow:0 16px 45px rgba(0,0,85,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top right, rgba(255,102,0,.10), transparent 30rem),
    linear-gradient(180deg,#fbfcff 0,#f3f6fb 100%);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit}
.hidden{display:none!important}
.shell{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:30;
  min-height:72px;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px clamp(16px,4vw,54px);
  color:#fff;
  background:rgba(0,0,85,.97);
  box-shadow:0 8px 28px rgba(0,0,85,.16);
  backdrop-filter:blur(12px)
}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.3px}
.brand-mark{
  width:42px;height:42px;border-radius:13px;background:var(--orange);
  display:grid;place-items:center;font-weight:950;color:#fff;
  box-shadow:inset 0 -5px 12px rgba(0,0,0,.12)
}
.brand small{display:block;font-weight:600;color:#cbd5ff;font-size:11px;letter-spacing:.8px}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn,.ghost-btn,.primary-btn,.secondary-btn,.danger-btn{
  border:0;border-radius:13px;font-weight:800;transition:.18s ease;
}
.icon-btn{width:42px;height:42px;background:rgba(255,255,255,.12);color:#fff}
.ghost-btn{padding:11px 15px;background:#fff;border:1px solid var(--line);color:var(--navy)}
.primary-btn{padding:12px 17px;background:var(--orange);color:#fff;box-shadow:0 9px 20px rgba(255,102,0,.20)}
.secondary-btn{padding:12px 17px;background:var(--navy);color:#fff}
.danger-btn{padding:12px 17px;background:#fff0f0;color:var(--danger);border:1px solid #ffd2d2}
button:hover{transform:translateY(-1px)}
.page{width:min(1380px,100%);margin:auto;padding:clamp(18px,3vw,42px)}
.hero{
  overflow:hidden;position:relative;border-radius:30px;
  padding:clamp(28px,5vw,70px);
  background:linear-gradient(135deg,var(--navy),#11119d);
  color:#fff;box-shadow:var(--shadow)
}
.hero:after{
  content:"";position:absolute;width:320px;height:320px;right:-90px;top:-120px;
  border-radius:50%;background:rgba(255,102,0,.23)
}
.hero:before{
  content:"";position:absolute;width:220px;height:220px;right:120px;bottom:-150px;
  border-radius:50%;border:32px solid rgba(255,255,255,.08)
}
.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-weight:900;font-size:12px;color:var(--orange)}
.hero h1{font-size:clamp(34px,5vw,70px);line-height:1.02;margin:10px 0 16px;max-width:900px}
.hero p{font-size:clamp(15px,2vw,20px);line-height:1.7;max-width:760px;color:#e9eaff;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.stat{padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.12);font-weight:800}
.section-head{
  display:flex;align-items:end;justify-content:space-between;gap:16px;
  margin:34px 0 16px
}
.section-head h2{margin:0;font-size:clamp(24px,3vw,34px);color:var(--navy)}
.section-head p{margin:5px 0 0;color:var(--muted)}
.search{
  width:min(360px,100%);border:1px solid var(--line);background:#fff;
  border-radius:14px;padding:12px 14px;outline:0
}
.search:focus{border-color:#aab0ff;box-shadow:0 0 0 4px rgba(0,0,85,.06)}
.topic-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px
}
.topic-card{
  border:1px solid #e9eaf3;background:#fff;border-radius:20px;padding:20px;
  box-shadow:0 8px 28px rgba(18,24,72,.06);
  transition:.2s ease;display:flex;flex-direction:column;min-height:205px
}
.topic-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(18,24,72,.11);border-color:#d8d9ff}
.topic-index{font-size:12px;font-weight:950;color:var(--orange);letter-spacing:1px}
.topic-card h3{font-size:20px;line-height:1.25;margin:8px 0;color:var(--navy)}
.topic-card p{color:var(--muted);line-height:1.55;margin:0 0 18px}
.topic-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.pill{font-size:12px;font-weight:800;padding:7px 9px;border-radius:999px;background:#f1f3fa;color:#3f4665}
.topic-card .primary-btn{margin-top:14px;width:100%}
.breadcrumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:14px}
.breadcrumb button{border:0;background:transparent;padding:0;color:var(--navy);font-weight:900}
.topic-banner{
  border-radius:26px;background:linear-gradient(130deg,var(--navy),#1b1b8f);
  color:#fff;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow)
}
.topic-banner h1{margin:4px 0 8px;font-size:clamp(28px,4vw,48px)}
.topic-banner p{margin:0;color:#e6e7ff}
.main-tabs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.tab-btn{
  border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:900;
  padding:13px 17px;border-radius:14px
}
.tab-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.mode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.mode-card{
  position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:20px;min-height:175px;box-shadow:0 10px 26px rgba(16,20,70,.06)
}
.mode-card .num{font-size:44px;font-weight:950;color:#edf0f8;position:absolute;right:15px;top:8px}
.mode-card h3{color:var(--navy);margin:0 0 9px;font-size:21px}
.mode-card p{color:var(--muted);line-height:1.5;min-height:46px}
.mode-card button{width:100%}
.panel{
  background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:0 10px 30px rgba(17,22,65,.06);padding:clamp(16px,3vw,28px)
}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.list-toolbar h2{margin:0;color:var(--navy)}
.q-list,.test-list,.kb-list{display:grid;gap:10px}
.q-row,.test-row,.kb-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
  border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff
}
.q-no{width:36px;height:36px;border-radius:11px;background:#f2f3fb;color:var(--navy);display:grid;place-items:center;font-weight:950}
.q-text{font-weight:750;line-height:1.45}
.small{font-size:12px;color:var(--muted)}
.practice-wrap{max-width:1000px;margin:auto}
.practice-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.progress-track{height:9px;background:#e9ebf2;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),#ff9b57);width:0;transition:.25s}
.question-card{
  text-align:center;background:#fff;border:1px solid var(--line);border-radius:27px;
  padding:clamp(25px,5vw,54px);box-shadow:var(--shadow)
}
.part-badge{display:inline-flex;padding:8px 11px;border-radius:999px;background:#eef0ff;color:var(--navy);font-weight:950;font-size:12px}
.question-card h2{font-size:clamp(27px,4.4vw,46px);line-height:1.2;color:var(--navy);margin:20px auto;max-width:900px}
.question-card ul{text-align:left;max-width:720px;margin:18px auto;font-size:18px;line-height:1.7}
.timer{
  margin:22px auto 5px;width:135px;height:135px;border-radius:50%;
  border:9px solid #eef0f6;display:grid;place-items:center;
  font-size:30px;font-weight:950;color:var(--navy);background:#fff
}
.timer.recording{border-color:#ffd4c0;color:var(--orange)}
.status{margin:12px 0;font-weight:850;color:var(--muted)}
.record-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d1d5db;margin-right:7px}
.record-dot.live{background:#ef4444;box-shadow:0 0 0 7px rgba(239,68,68,.12);animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(.78)}}
.notes{
  width:100%;max-width:760px;min-height:120px;border:1px solid var(--line);
  border-radius:16px;padding:14px;resize:vertical;outline:0;background:#fbfcff
}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.result-card{
  margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px
}
.result-card h3{color:var(--navy);margin-top:0}
.transcript{
  font-size:17px;line-height:1.75;background:#f8f9fd;border-radius:16px;padding:16px;
  border-left:4px solid var(--orange)
}
.word-chip{
  border:1px solid #dfe2ee;background:#fff;padding:8px 10px;border-radius:999px;
  margin:4px;font-weight:800;color:#27304f
}
.word-chip.flagged{border-color:#ffd09b;background:#fff8ef;color:#9a5100}
.notice{
  padding:13px 15px;border-radius:14px;background:#fff8ed;border:1px solid #ffe1b5;
  color:#8c5200;line-height:1.55
}
.review-part{margin:20px 0}
.review-part h3{font-size:24px;color:var(--navy);border-bottom:2px solid #eceef7;padding-bottom:10px}
.review-item{padding:14px 0;border-bottom:1px dashed #e4e6ef}
.review-q{font-weight:900;color:#343a62;margin-bottom:8px}
.review-a{line-height:1.65}
.kb-top-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kb-tab{
  border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 8px;
  font-weight:900;color:var(--navy);min-height:76px
}
.kb-tab span{display:block;color:var(--orange);font-size:12px;margin-bottom:4px}
.kb-tab.active{background:var(--navy);color:#fff}
.kb-tab.active span{color:#ffb27e}
.kb-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
  margin-bottom:18px
}
.kb-head h2{color:var(--navy);margin:0;font-size:clamp(26px,3vw,38px)}
.exercise-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.exercise-row button{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:850;border-radius:12px;padding:10px 12px}
.exercise-row button:hover{border-color:#c6c8f1}
.vocab-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:650px;overflow:auto;padding-right:4px}
.vocab-item{
  border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff
}
.vocab-term{font-weight:950;color:var(--navy);font-size:17px}
.vocab-ipa{color:var(--orange);font-weight:750;margin:4px 0}
.vocab-meaning{color:#4b5563;line-height:1.5}
.source-tag{font-size:10px;color:#7a819c;margin-top:8px}
.exercise-box{
  margin-top:18px;border:1px solid #daddeb;border-radius:20px;padding:20px;
  background:linear-gradient(180deg,#fff,#fbfcff)
}
.flashcard{
  min-height:290px;border-radius:22px;background:linear-gradient(145deg,var(--navy),#22229d);
  color:#fff;display:grid;place-items:center;text-align:center;padding:30px;cursor:pointer
}
.flashcard .front{font-size:clamp(28px,4vw,48px);font-weight:950}
.flashcard .back{font-size:21px;line-height:1.6}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-btn{
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;
  text-align:left;font-weight:800;min-height:48px
}
.match-btn.selected{outline:3px solid rgba(255,102,0,.2);border-color:var(--orange)}
.match-btn.done{background:#ebfff4;border-color:#a6e8c5;color:#087744}
.quiz-options{display:grid;gap:10px;margin-top:15px}
.quiz-option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:800}
.quiz-option.good{border-color:#9cddbb;background:#ecfff5}
.quiz-option.bad{border-color:#ffc4c4;background:#fff0f0}
.fill-line{font-size:23px;line-height:1.6;font-weight:800;color:var(--navy);margin:12px 0}
.fill-input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}
.reader-section{max-width:980px;margin:auto}
.reader-title{font-size:clamp(30px,4vw,46px);color:var(--navy);margin:0 0 8px}
.reader-intro{color:var(--muted);font-size:17px;line-height:1.7;margin-bottom:25px}
.reader-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;margin:12px 0}
.reader-card h3{margin:0 0 10px;color:var(--navy);font-size:20px}
.reader-card p{line-height:1.7;margin:7px 0}
.reader-card .bigline{font-size:19px;font-weight:850}
.idea-card{border-left:5px solid var(--orange)}
.framework{
  display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px
}
.framework div{border-radius:13px;background:#f4f5fb;padding:12px}
.framework strong{display:block;color:var(--navy);margin-bottom:4px}
.level{
  display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start;
  border-radius:18px;padding:18px;margin:12px 0;border:1px solid var(--line);background:#fff
}
.level-label{font-weight:950;color:var(--orange);font-size:14px;text-transform:uppercase;letter-spacing:.7px}
.level-text{font-size:18px;line-height:1.7}
.modal{
  position:fixed;inset:0;background:rgba(8,10,42,.62);z-index:80;
  display:grid;place-items:center;padding:18px
}
.modal-card{width:min(600px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.modal-card h2{color:var(--navy);font-size:36px;margin:0 0 6px}
.footer{padding:28px;text-align:center;color:#7a8195;font-size:13px}
@media(max-width:1050px){
  .topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kb-top-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:720px){
  .topbar{padding:10px 14px}
  .brand-text{font-size:14px}
  .brand small{display:none}
  .page{padding:14px}
  .topic-grid,.mode-grid,.vocab-list{grid-template-columns:1fr}
  .kb-top-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .section-head,.kb-head{align-items:stretch;flex-direction:column}
  .q-row,.test-row{grid-template-columns:auto 1fr}
  .q-row button,.test-row button{grid-column:1/-1}
  .question-card{padding:24px 14px}
  .question-card h2{font-size:28px}
  .timer{width:112px;height:112px;font-size:26px}
  .framework{grid-template-columns:1fr 1fr}
  .level{grid-template-columns:1fr;gap:8px}
}
@media(max-width:420px){
  .kb-top-grid{grid-template-columns:1fr 1fr}
  .main-tabs{display:grid;grid-template-columns:1fr 1fr}
  .main-tabs .tab-btn{width:100%}
  .framework{grid-template-columns:1fr}
}

/* ===== 2026-09-23 compact layout + selection/game screen update ===== */
.page{padding:18px clamp(16px,3vw,38px) 28px}
.topic-banner{
  border-radius:22px;
  padding:18px clamp(22px,3vw,34px);
  min-height:0;
}
.topic-banner h1{font-size:clamp(27px,3.2vw,42px);margin:2px 0 5px;line-height:1.05}
.topic-banner p{font-size:14px}
.main-tabs{margin:12px 0;gap:8px}
.tab-btn{padding:10px 14px}
.panel{padding:16px 18px;border-radius:18px}
.kb-head{margin-bottom:10px;gap:12px}
.kb-head h2{font-size:clamp(23px,2.7vw,32px)}
.kb-top-grid{gap:7px;margin-bottom:10px}
.kb-tab{min-height:62px;padding:9px 7px;border-radius:14px;font-size:13px;line-height:1.15}
.kb-tab span{margin-bottom:2px}
.exercise-row{margin:9px 0}
.vocab-list{gap:8px;max-height:calc(100vh - 330px)}
.vocab-item{padding:10px 12px;border-radius:13px;position:relative}
.vocab-term{font-size:16px}
.vocab-ipa{margin:2px 0;font-size:13px}
.vocab-meaning{font-size:14px;line-height:1.35}
.source-tag{margin-top:5px}
.learn-selector{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:9px 10px;margin:8px 0 10px;border:1px solid var(--line);background:#f8f9fd;border-radius:13px
}
.learn-selector .selector-actions{display:flex;gap:7px;flex-wrap:wrap}
.learn-check{
  position:absolute;right:10px;top:10px;width:20px;height:20px;accent-color:var(--orange);cursor:pointer
}
.vocab-item.selected{border-color:#ffb27e;background:#fff9f5;box-shadow:0 0 0 2px rgba(255,102,0,.06)}
.game-page{width:min(1180px,100%);margin:auto;padding:14px 18px 20px}
.game-shell{
  min-height:calc(100vh - 106px);
  display:flex;flex-direction:column;
}
.game-top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px
}
.game-title{margin:0;color:var(--navy);font-size:clamp(22px,3vw,32px)}
.game-stage{flex:1;display:flex;align-items:center;justify-content:center}
.game-stage .exercise-box{
  width:min(900px,100%);margin:0;padding:16px 18px;border-radius:18px;
  max-height:calc(100vh - 155px);overflow:auto
}
.game-stage .flashcard{
  min-height:min(52vh,430px);padding:22px;border-radius:18px
}
.game-stage .flashcard .front{font-size:clamp(34px,6vw,64px)}
.game-stage .quiz-options{gap:8px}
.game-stage .quiz-option{padding:11px 13px}
.game-stage .match-btn{padding:9px 11px;min-height:42px}
.game-stage .action-row{margin-top:11px}
.live-transcript{
  max-width:760px;margin:12px auto 0;text-align:left;
  padding:11px 13px;border-radius:14px;background:#f7f8fc;border:1px solid #e4e7f0;
  min-height:54px;color:#303650;line-height:1.5
}
.live-transcript b{color:var(--navy)}
.mic-note{font-size:12px;color:var(--muted);margin-top:7px}
@media(max-width:720px){
  .page{padding:10px 10px 20px}
  .topic-banner{padding:14px 16px;border-radius:17px}
  .topic-banner h1{font-size:27px}
  .panel{padding:12px}
  .kb-top-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .kb-tab{min-height:54px;font-size:12px}
  .vocab-list{max-height:none}
  .game-page{padding:8px 10px 14px}
  .game-shell{min-height:calc(100vh - 92px)}
  .game-stage .exercise-box{max-height:none}
}


/* ===== V3: denser games, responsive chunks, pronunciation cards ===== */
.game-page{width:min(1160px,100%);margin:auto;padding:8px 14px 14px}
.game-shell{min-height:calc(100vh - 86px);display:flex;flex-direction:column}
.game-top{margin-bottom:4px;min-height:58px}
.game-title{font-size:clamp(22px,2.6vw,31px);line-height:1.05}
.game-stage{flex:1;display:grid;place-items:center;min-height:0}
.game-stage .exercise-box{
  width:min(980px,100%);max-height:none;overflow:visible;
  margin:0 auto;padding:14px 16px;border-radius:18px
}
.game-stage .flashcard{min-height:min(56vh,470px)}
.match-grid{gap:8px}
.game-stage .match-btn{min-height:38px;padding:7px 10px;margin:2px 0!important;line-height:1.15}
.game-progress{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:750
}
.pron-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px
}
.pron-card{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff
}
.pron-word{font-size:18px;font-weight:950;color:var(--navy)}

  justify-content:center;
  color:#fff;
  background:
    radial-gradient(circle at 90% 10%,rgba(255,102,0,.38),transparent 18rem),
    radial-gradient(circle at 10% 100%,rgba(255,255,255,.10),transparent 18rem),
    linear-gradient(140deg,#000055 0%,#121276 55%,#25259f 100%);
}
.login-visual:before,
.login-visual:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.login-visual:before{
  width:280px;height:280px;right:-100px;bottom:-100px;
  border:34px solid rgba(255,255,255,.08);
}
.login-visual:after{
  width:160px;height:160px;left:-65px;top:-55px;
  border:24px solid rgba(255,102,0,.22);
}
.login-logo{
  position:relative;z-index:1;
  width:58px;height:58px;border-radius:17px;
  display:grid;place-items:center;
  margin-bottom:28px;
  background:var(--orange);
  color:#fff;
  font-size:24px;
  font-weight:950;
  box-shadow:0 14px 30px rgba(0,0,0,.18);
}
.login-visual .eyebrow{
  position:relative;z-index:1;
  color:#ffb07b;
}
.login-visual h1{
  position:relative;z-index:1;
  margin:9px 0 14px;
  font-size:clamp(40px,4.5vw,64px);
  line-height:.98;
  letter-spacing:-1.7px;
}
.login-visual p{
  position:relative;z-index:1;
  max-width:520px;
  margin:0;
  color:#e3e5ff;
  font-size:16px;
  line-height:1.7;
}
.login-features{
  position:relative;z-index:1;
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:28px;
}
.login-features span{
  padding:9px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.13);
  font-size:11px;
  font-weight:850;
  color:#fff;
}
.login-form-panel{
  padding:clamp(30px,5vw,62px);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
}
.login-form{
  width:min(380px,100%);
}
.login-form .eyebrow{margin-bottom:8px}
.login-form h2{
  margin:0 0 8px;
  color:var(--navy);
  font-size:clamp(30px,3vw,42px);
  line-height:1.05;
}
.login-form > p{
  margin:0 0 26px;
  color:#6b7280;
  line-height:1.6;
}
.login-label{
  display:block;
  margin:0 0 7px;
  color:#343a62;
  font-size:13px;
  font-weight:900;
}
.password-wrap{
  position:relative;
}
.login-input{
  width:100%;
  height:54px;
  padding:0 52px 0 15px;
  border:1.5px solid #dfe2ec;
  border-radius:14px;
  outline:none;
  background:#fbfcff;
  color:#11132b;
  font-size:16px;
  font-weight:700;
  transition:.16s ease;
}
.login-input:focus{
  border-color:#a5a7e7;
  box-shadow:0 0 0 4px rgba(0,0,85,.06);
  background:#fff;
}
.password-eye{
  position:absolute;right:7px;top:7px;
  width:40px;height:40px;
  border:0;border-radius:10px;
  background:transparent;
  color:var(--navy);
  display:grid;place-items:center;
}
.login-submit{
  width:100%;
  min-height:52px;
  margin-top:14px;
  font-size:15px;
}
.login-error{
  display:none;
  margin-top:11px;
  padding:10px 12px;
  border-radius:11px;
  background:#fff1f1;
  border:1px solid #ffd0d0;
  color:#b42323;
  font-size:13px;
  font-weight:750;
}
.login-error.show{display:block}
.login-note{
  margin-top:18px;
  text-align:center;
  color:#9298aa;
  font-size:11px;
}
.login-lock{
  display:inline-grid;
  place-items:center;
  width:24px;height:24px;
  margin-right:5px;
  border-radius:8px;
  background:#f0f2f8;
}
.login-shake{animation:loginShake .28s ease}
@keyframes loginShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

@media(max-width:800px){
  .login-page{
    min-height:0;
    height:calc(100svh - 62px - 34px);
    padding:10px;
    overflow:auto;
  }
  .login-shell{
    min-height:0;
    grid-template-columns:1fr;
    border-radius:24px;
  }
  .login-visual{
    min-height:210px;
    padding:25px 24px;
  }
  .login-logo{
    width:48px;height:48px;border-radius:14px;
    margin-bottom:14px;
    font-size:20px;
  }
  .login-visual h1{
    font-size:clamp(32px,9vw,47px);
    margin:6px 0 10px;
  }
  .login-visual p{
    font-size:13px;
    line-height:1.5;
  }
  .login-features{margin-top:14px}
  .login-features span{font-size:9px;padding:7px 9px}
  .login-form-panel{padding:24px 20px}
  .login-form h2{font-size:30px}
  .login-form > p{margin-bottom:18px;font-size:13px}
}

@media(max-width:430px){
  .login-page{padding:6px}
  .login-shell{border-radius:19px}
  .login-visual{min-height:185px;padding:19px}
  .login-visual p{display:none}
  .login-features{margin-top:11px}
  .login-features span:nth-child(3){display:none}
  .login-form-panel{padding:20px 16px}
}

  async prepareMicrophone(initial=false){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      this.micPermission="unsupported";
      return false;
    }
    if(this.micPermission==="granted") return true;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
      this.micPermission="granted";
      const badge=document.getElementById("micReadyBadge");
      if(badge){
        badge.classList.remove("hidden");
        setTimeout(()=>badge.classList.add("hidden"),2200);
      }
      return true;
    }catch(e){
      this.micPermission=(e && (e.name==="NotAllowedError"||e.name==="PermissionDeniedError"))?"denied":"error";
      return false;
    }
  },

  buildIPACache(){
    this.ipaCache={};
    try{
      KNOWLEDGE_DATA.forEach(g=>{
        [1,2,3,4].forEach(t=>{
          (g.tiers?.[String(t)]||[]).forEach(obj=>{
            const it=this.parseLearningItem(obj);
            const key=(it.term||"").toLowerCase().trim();
            if(key && it.ipa && !key.includes(" ") && !this.ipaCache[key]) this.ipaCache[key]=it.ipa;
          });
        });
      });
    }catch(e){}
  },

  localIPA(word){
    const w=(word||"").toLowerCase().replace(/[^a-z'-]/g,"");
    if(!w) return "";
    if(this.ipaCache[w]) return this.ipaCache[w];
    const base=w.replace(/(?:'s|s|es|ed|ing)$/,"");
    return this.ipaCache[base]||"";
  },

  async resolveIPA(word, elementId){
    const el=document.getElementById(elementId);
    if(!el) return;
    const local=this.localIPA(word);
    if(local){el.textContent=local;return;}
    el.textContent="Đang tải IPA…";
    try{
      const res=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if(!res.ok) throw new Error("no ipa");
      const data=await res.json();
      let ipa="";
      for(const entry of (Array.isArray(data)?data:[])){
        if(entry.phonetic){ipa=entry.phonetic;break;}
        const p=(entry.phonetics||[]).find(x=>x.text);
        if(p?.text){ipa=p.text;break;}
      }
      el.textContent=ipa||"IPA không có sẵn";
      if(ipa)this.ipaCache[(word||"").toLowerCase()]=ipa;
    }catch(e){
      el.textContent="IPA không có sẵn";
    }
  },

  click(){
    if(!this.soundOn) return;
    try{
      const A = window.AudioContext || window.webkitAudioContext;
      if(!A) return;
      const ctx = new A();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 620;
      gain.gain.setValueAtTime(.035,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.045);
      osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.05);
      osc.onended=()=>ctx.close();
    }catch(e){}
  },

  speak(text,onend){

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-GB";u.rate=.92;u.pitch=1;
    u.onend=()=>onend&&onend();
    u.onerror=()=>onend&&onend();
    speechSynthesis.speak(u);

  startPreparation(sec){

    this.setStatus("📝 Preparation Time — ghi chú từ khóa");
    this.setTimer(left,false);
    clearInterval(this.prepTimerId);
    this.prepTimerId=setInterval(()=>{
      left--;
      this.setTimer(left,false);
      if(left<=0){
        clearInterval(this.prepTimerId);
        this.beepCountdown();
        this.startRecording(120);
      }else if(left<=3) this.beepCountdown();
    },1000);
  },

  setTimer(sec,recording=true){
    const el=document.getElementById("timer");if(!el)return;
    const m=String(Math.floor(sec/60)).padStart(2,"0"), s=String(sec%60).padStart(2,"0");

    el.classList.toggle("recording",recording);

  setStatus(t){
    const el=document.getElementById("status");if(el)el.innerHTML=`<span class="record-dot ${t.includes("Recording")?"live":""}" id="recordDot"></span>${t}`;
  },

  beepCountdown(){
    if(!this.soundOn)return;
    try{
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      const ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=850;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);o.onended=()=>ctx.close();
    }catch(e){}
  },

  async startRecording(maxSec){
    clearInterval(this.timerId);
    clearTimeout(this.recognitionRestartTimer);
    this.liveTranscript="";
    this.recognitionFinal="";
    this.recognitionInterim="";
    this.recognitionError="";
    this.isRecordingActive=true;
    this.finishingRecording=false;
    this.updateLiveTranscript();
    this.setStatus("🔴 Recording — hãy trả lời bằng tiếng Anh");
    document.getElementById("stopBtn")?.classList.remove("hidden");
    this.setTimer(maxSec,true);

    try{
      this.mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
      this.chunks=[];
      this.currentMediaRecorder=new MediaRecorder(this.mediaStream);
      this.currentMediaRecorder.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data)};
      this.currentMediaRecorder.start(250);
    }catch(err){
      this.isRecordingActive=false;
      this.setStatus("⚠ Không truy cập được microphone. Hãy cấp quyền micro cho trình duyệt.");
      document.getElementById("stopBtn")?.classList.add("hidden");
      return;
    }

    this.startRecognition(true);

    let left=maxSec;
    this.timerId=setInterval(()=>{
      left--;this.setTimer(left,true);
      if(left<=3&&left>0)this.beepCountdown();
      if(left<=0)this.finishRecording();
    },1000);
  },

  updateLiveTranscript(){
    this.liveTranscript=(this.recognitionFinal+" "+this.recognitionInterim).replace(/\s+/g," ").trim();
    const el=document.getElementById("liveTranscriptText");
    if(el) el.textContent=this.liveTranscript || (this.recognitionError ? this.recognitionError : "Đang chờ bạn nói...");
  },

  startRecognition(reset=false){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      this.recognitionError="Trình duyệt này không hỗ trợ Speech Recognition.";
      this.updateLiveTranscript();
      return;
    }
    if(reset){
      this.recognitionFinal="";
      this.recognitionInterim="";
    }
    try{
      const r=new SR();
      r.lang="en-GB";
      r.continuous=true;
      r.interimResults=true;
      r.maxAlternatives=1;

      r.onresult=e=>{
        let interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const txt=(e.results[i][0].transcript||"").trim();
          if(!txt) continue;
          if(e.results[i].isFinal){
            this.recognitionFinal=(this.recognitionFinal+" "+txt).replace(/\s+/g," ").trim();
          }else{
            interim+=(interim?" ":"")+txt;
          }
        }
        this.recognitionInterim=interim;
        this.updateLiveTranscript();
      };

      r.onerror=e=>{
        const code=e.error||"";
        if(code==="not-allowed"||code==="service-not-allowed"){
          this.recognitionError="Speech Recognition bị chặn. Hãy cấp quyền microphone và dùng Chrome/Edge qua HTTPS hoặc localhost.";
          this.isRecordingActive=false;
        }else if(code!=="aborted"&&code!=="no-speech"){
          this.recognitionError=`Speech Recognition: ${code}`;
        }
        this.updateLiveTranscript();
      };

      r.onend=()=>{
        this.recognition=null;
        this.recognitionInterim="";
        this.updateLiveTranscript();
        if(this.isRecordingActive){
          clearTimeout(this.recognitionRestartTimer);
          this.recognitionRestartTimer=setTimeout(()=>this.startRecognition(false),180);
        }
      };

      r.start();
      this.recognition=r;
    }catch(e){
      this.recognitionError="Không khởi động được Speech Recognition.";
      this.updateLiveTranscript();
      if(this.isRecordingActive){
        clearTimeout(this.recognitionRestartTimer);
        this.recognitionRestartTimer=setTimeout(()=>this.startRecognition(false),500);
      }
    }
  },

  async finishRecording(){
    if(this.finishingRecording) return;
    if(!this.currentMediaRecorder || this.currentMediaRecorder.state==="inactive") return;
    this.finishingRecording=true;
    this.isRecordingActive=false;
    clearInterval(this.timerId);
    clearTimeout(this.recognitionRestartTimer);

    try{this.recognition?.stop()}catch(e){}
    const recorder=this.currentMediaRecorder;
    const blobPromise=new Promise(resolve=>{
      recorder.onstop=()=>resolve(new Blob(this.chunks,{type:recorder.mimeType||"audio/webm"}));
    });
    try{recorder.stop()}catch(e){}
    this.mediaStream?.getTracks().forEach(t=>t.stop());
    this.mediaStream=null;
    document.getElementById("stopBtn")?.classList.add("hidden");
    this.setStatus("⏳ Đang hoàn tất transcript...");

    /* Give Web Speech Recognition time to emit its last final result. */
    await new Promise(r=>setTimeout(r,650));
    this.recognitionInterim="";
    this.updateLiveTranscript();

    const blob=await blobPromise;
    const url=URL.createObjectURL(blob);
    const transcript=(this.recognitionFinal||this.liveTranscript||"").replace(/\s+/g," ").trim();
    const answer={
      question:this.questionContext.mode==="part2"?this.questionContext.item.prompt:this.questionContext.item,
      transcript,
      audioUrl:url,
      blob,
      mode:this.questionContext.mode
    };

    this.currentMediaRecorder=null;
    this.recognition=null;
    this.finishingRecording=false;
    this.setStatus(transcript?"✓ Đã ghi âm và tạo transcript":"✓ Đã ghi âm • chưa nhận được transcript");

    if(this.questionContext.full){
      this.fullSession.answers.push(answer);
      this.advanceFullTest();
    }else{
      this.showPracticeResult(answer);
    }
  },

  extractPracticeWords(text){

    return this.unique((text||"").toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[]).filter(w=>w.length>3&&!stop.has(w)).slice(0,30);
  },

  mappedGroups(){
    return (KNOWLEDGE_MAP[this.selectedCategory]||[0]).map(i=>KNOWLEDGE_DATA[i]).filter(Boolean);

  mergedTier(n){
    return this.mappedGroups().flatMap(g=>g.tiers[String(n)]||[]);
  },

  parseLearningItem(obj){
    const raw=obj.text||"";
    const parts=raw.split(/\s+—\s+/);
    const left=parts[0]||raw;
    const meaning=parts.slice(1).join(" — ")||"";
    const ipaMatches=[...left.matchAll(/\/[^/]+\//g)].map(m=>m[0]);
    const ipa=ipaMatches.join(" ");
    let cleaned=left.replace(/\/[^/]+\//g,"").replace(/\s+/g," ").trim();
    let pos="";
    const posRe=/\s+(n\.\s*phr\.|v\.\s*phr\.|adj\.\s*phr\.|adv\.\s*phr\.|n\.|v\.|adj\.|adv\.|prep\.|pron\.|conj\.|phr\.)\s*$/i;
    const m=cleaned.match(posRe);
    if(m){
      pos=m[1].replace(/\s+/g," ");
      cleaned=cleaned.slice(0,m.index).trim();
    }
    /* A second pass handles malformed source strings such as “competition n.”. */
    cleaned=cleaned.replace(/\s+(?:n|v|adj|adv|prep|pron|conj)\.\s*$/i,"").trim();
    return {raw,term:cleaned,ipa,meaning,pos,subtopic:obj.subtopic||""};
  },


  paraphrasePair(item){
    const raw=item?.raw||"";
    const left=(raw.split(/\s+—\s+/)[0]||raw);
    const cleanPart=s=>s
      .replace(/\/[^/]+\//g,"")
      .replace(/\s+(?:n\.\s*phr\.|v\.\s*phr\.|adj\.\s*phr\.|adv\.\s*phr\.|n\.|v\.|adj\.|adv\.|phr\.)\s*$/i,"")
      .replace(/\s+/g," ").trim();
    const parts=left.split(/\s*→\s*/).map(cleanPart).filter(Boolean);
    if(parts.length<2) return {front:item.term,back:item.term,backSpeech:item.term};
    return {front:parts[0],back:parts.slice(1).join("  /  "),backSpeech:parts.slice(1).join(". ")};
  },

  speakFlashCurrent(){
    const E=this.exercise;
    const item=E.deck[E.index];
    if(E.tier===4){

    }else{
      this.speak(item.term.replace(/→/g," "));
    }
  },

  toggleLearningItem(tier,index,event){
    if(event && event.target && event.target.tagName==="BUTTON") return;
    this.click();
    if(!this.selectedLearning[tier]) this.selectedLearning[tier]=new Set();
    const set=this.selectedLearning[tier];
    if(set.has(index)) set.delete(index); else set.add(index);
    const item=document.getElementById(`vitem${tier}_${index}`);
    if(item){
      item.classList.toggle("selected",set.has(index));
      const cb=item.querySelector(".learn-check"); if(cb) cb.checked=set.has(index);
    }
    const count=document.getElementById("selectedCount");if(count)count.textContent=set.size;
  },

    const data=this.learningData(tier);
    this.selectedLearning[tier]=new Set(data.map((_,i)=>i));

      }

    }
    if(!E.flashBack){
      face.innerHTML=`<div class="front">${this.esc(item.term)}</div><p>Chạm để xem nghĩa</p>`;
    }else{
      face.innerHTML=`<div class="back">${item.ipa?`<div style="color:#ffb07a;font-weight:900">${this.esc(item.ipa)}</div>`:""}<div style="font-size:30px;font-weight:950;margin:8px 0">${this.esc(item.meaning)}</div><div>${this.esc(item.term)}</div></div>`;
    }
    this.speak(item.term.replace(/→/g," "));
  },

  flashNext(){this.exercise.index=(this.exercise.index+1)%this.exercise.deck.length;this.renderFlash()},
  flashPrev(){this.exercise.index=(this.exercise.index-1+this.exercise.deck.length)%this.exercise.deck.length;this.renderFlash()},


  renderMatch(){
    const E=this.exercise;
    const size=E.matchBatchSize||10;
    const start=E.matchBatch*size;
    const left=E.deck.slice(start,start+size);
    E.matchCurrent=left;
    const right=this.shuffle(left.map((x,i)=>({meaning:x.meaning,id:i})));
    E.matchRight=right;E.matchSel=null;E.matched=new Set();
    const totalBatches=Math.ceil(E.deck.length/size);
    document.getElementById("exerciseArea").innerHTML=`<div class="exercise-box">
      <div class="game-progress"><span>Đợt ${E.matchBatch+1} / ${totalBatches}</span><span>${start+1}–${Math.min(start+left.length,E.deck.length)} / ${E.deck.length} mục</span></div>
      <h3 style="color:var(--navy);margin:4px 0 8px">Ghép English ↔ Vietnamese</h3>
      <div class="match-grid">
        <div>${left.map((x,i)=>`<button id="ml${i}" class="match-btn" style="width:100%" onclick="app.pickMatch('l',${i})">${this.esc(x.term)}</button>`).join("")}</div>
        <div>${right.map((x,i)=>`<button id="mr${i}" class="match-btn" style="width:100%" onclick="app.pickMatch('r',${i})">${this.esc(x.meaning)}</button>`).join("")}</div>
      </div>
      <div id="matchMsg" class="small" style="margin-top:8px">Chọn một mục bên trái rồi chọn nghĩa bên phải.</div>
    </div>`;
  },

  pickMatch(side,i){
    this.click();const E=this.exercise;
    if(side==="l"){
      if(E.matched.has(i))return;
      document.querySelectorAll("[id^=ml]").forEach(x=>x.classList.remove("selected"));
      document.getElementById("ml"+i).classList.add("selected");E.matchSel=i;return;
    }
    if(E.matchSel===null)return;
    const target=E.matchRight[i].id;
    if(target===E.matchSel){
      E.matched.add(target);
      document.getElementById("ml"+target).classList.add("done");
      document.getElementById("mr"+i).classList.add("done");
      E.matchSel=null;
      if(E.matched.size===E.matchCurrent.length){
        const totalBatches=Math.ceil(E.deck.length/(E.matchBatchSize||10));
        if(E.matchBatch+1<totalBatches){
          document.getElementById("matchMsg").innerHTML=`✓ Hoàn thành đợt này. <button class="primary-btn" style="margin-left:8px;padding:7px 11px" onclick="app.nextMatchBatch()">Đợt tiếp theo →</button>`;
        }else{
          document.getElementById("matchMsg").innerHTML=`✓ Hoàn thành toàn bộ ${E.deck.length} mục.`;
        }
      }else{
        document.getElementById("matchMsg").textContent="✓ Chính xác";
      }
    }else{
      document.getElementById("matchMsg").textContent="Chưa đúng, thử lại.";
    }
  },

  nextMatchBatch(){
    this.exercise.matchBatch++;
    this.renderMatch();
  },


  renderQuiz(){
    const E=this.exercise,item=E.deck[E.index];
    const pool=this.shuffle(E.data.filter(x=>x.meaning!==item.meaning)).slice(0,3).map(x=>x.meaning);
    const opts=this.shuffle([item.meaning,...pool]);
    document.getElementById("exerciseArea").innerHTML=`<div class="exercise-box game-board">
      <div class="game-progress"><span>Question ${E.index+1} / ${E.deck.length}</span><span>Điểm ${E.score}</span></div>
      <h3 class="quiz-board-title">“${this.esc(item.term)}” có nghĩa phù hợp nhất là gì?</h3>
      <div class="quiz-options">${opts.map((o,i)=>`<button class="quiz-option" onclick="app.answerQuiz(this,'${encodeURIComponent(o)}','${encodeURIComponent(item.meaning)}')">${this.esc(o)}</button>`).join("")}</div>
      <div id="quizNext" class="action-row hidden"><button class="primary-btn" onclick="app.quizNext()">Tiếp →</button></div>
    </div>`;
  },
  answerQuiz(btn,ans,correct){
    ans=decodeURIComponent(ans); correct=decodeURIComponent(correct);
    document.querySelectorAll(".quiz-option").forEach(b=>b.disabled=true);
    btn.classList.add(ans===correct?"good":"bad");
    if(ans!==correct){
      [...document.querySelectorAll(".quiz-option")].find(b=>b.textContent===correct)?.classList.add("good");
    }else this.exercise.score++;
    document.getElementById("quizNext").classList.remove("hidden");
  },
  quizNext(){
    this.exercise.index++;
    if(this.exercise.index>=this.exercise.deck.length){
      document.getElementById("exerciseArea").innerHTML=`<div class="exercise-box" style="text-align:center"><h3>Hoàn thành</h3><p>Điểm: <b>${this.exercise.score}/${this.exercise.deck.length}</b></p><button class="primary-btn" onclick="app.startExercise(${this.exercise.tier},'quiz')">Làm lại</button></div>`;
    }else this.renderQuiz();
  },

  renderFill(){
    const E=this.exercise,item=E.deck[E.index];
    let words=item.term.split(/\s+/).filter(Boolean);
    let answer="", prompt="", candidates=[];
    if(words.length>=2){
      let idx=Math.min(1,words.length-1);
      answer=words[idx].replace(/[^\p{L}'-]/gu,"");
      words[idx]="_____";
      prompt=words.join(" ");
      candidates=E.data.flatMap(x=>x.term.split(/\s+/)).map(x=>x.replace(/[^\p{L}'-]/gu,"")).filter(x=>x && x.toLowerCase()!==answer.toLowerCase());
    }else{
      answer=item.term.replace(/[^\p{L}'-]/gu,"");
      prompt=`_____ = ${item.meaning}`;
      candidates=E.data.map(x=>x.term.replace(/[^\p{L}'-]/gu,"")).filter(x=>x && x.toLowerCase()!==answer.toLowerCase());
    }
    const distract=this.shuffle(this.unique(candidates)).slice(0,3);
    const opts=this.shuffle([answer,...distract]);
    E.fillAnswer=answer.toLowerCase();
    document.getElementById("exerciseArea").innerHTML=`<div class="exercise-box game-board">
      <div class="game-progress"><span>Fill ${E.index+1} / ${E.deck.length}</span><span>Điểm ${E.score}</span></div>
      <div class="fill-board-title">${this.esc(prompt)}</div>
      <div class="fill-options">
        ${opts.map(o=>`<button class="fill-option" onclick="app.chooseFill(this,'${encodeURIComponent(o)}')">${this.esc(o)}</button>`).join("")}
      </div>
      <div id="fillMsg" class="small" style="margin:12px auto 0;width:min(980px,100%)"></div>
      <div id="fillNext" class="action-row hidden"><button class="primary-btn" onclick="app.fillNext()">Tiếp →</button></div>
    </div>`;
  },

  chooseFill(btn,value){
    const v=decodeURIComponent(value).toLowerCase();
    document.querySelectorAll(".fill-option").forEach(b=>b.disabled=true);
    const msg=document.getElementById("fillMsg");
    if(v===this.exercise.fillAnswer){
      btn.classList.add("good");
      msg.textContent="✓ Chính xác";
      msg.style.color="var(--success)";
      this.exercise.score++;
    }else{
      btn.classList.add("bad");
      const correct=[...document.querySelectorAll(".fill-option")].find(b=>b.textContent.trim().toLowerCase()===this.exercise.fillAnswer);
      correct?.classList.add("good");
      msg.textContent=`Đáp án đúng: ${this.exercise.fillAnswer}`;
      msg.style.color="var(--danger)";
    }
    document.getElementById("fillNext").classList.remove("hidden");
  },

  fillNext(){
    this.exercise.index++;
    if(this.exercise.index>=this.exercise.deck.length){
      document.getElementById("exerciseArea").innerHTML=`<div class="exercise-box" style="text-align:center"><h3>Hoàn thành</h3><p>Điểm: <b>${this.exercise.score}/${this.exercise.deck.length}</b></p><button class="primary-btn" onclick="app.returnToKnowledge(${this.exercise.tier})">Về Knowledge Bank</button></div>`;
    }else this.renderFill();
  },


  renderChunks(area){
    const indexes=KNOWLEDGE_MAP[this.selectedCategory]||[0];
    const data=indexes.flatMap(i=>NORMALIZED_CHUNKS[i]||[]);
    area.innerHTML=`<div class="reader-section" style="max-width:1180px">
      <div class="eyebrow">Speaking Knowledge</div>
      <h2 class="reader-title" style="margin-bottom:4px">Natural Speaking Chunks</h2>
      <div class="chunk-summary-v6">
        <p class="reader-intro">English chunk nổi bật, nghĩa tiếng Việt ngay bên dưới và nút nghe ở cùng một khung.</p>
        <span class="pill">${data.length} bilingual chunks</span>
      </div>
      <div class="chunk-grid-v6">
        ${data.map((it,i)=>`<article class="chunk-card-v6">
          <div class="chunk-copy-v6">
            ${it.subtopic?`<div class="chunk-topic-v6">${this.esc(it.subtopic)}</div>`:""}
            <div class="chunk-en-v6">${this.esc(it.en)}</div>
            <div class="chunk-vi-v6">${this.esc(it.vi)}</div>
          </div>
          <button class="ghost-btn chunk-listen-v6" title="Nghe" onclick="app.speak(decodeURIComponent('${encodeURIComponent(it.en)}'))">🔊</button>
        </article>`).join("")}
      </div>
    </div>`;
  },


  renderIdeas(area){
    const qs=this.bankData("part3");
    const coll=this.mergedTier(2).map(x=>this.parseLearningItem(x)).filter(x=>x.term);
    const para=this.mergedTier(4).map(x=>this.parseLearningItem(x)).filter(x=>x.term);
    const chunks=this.mergedTier(5).map(x=>this.parseLearningItem(x)).filter(x=>x.term);
    area.innerHTML=`<div class="reader-section">
      <div class="eyebrow">Speaking Knowledge</div>
      <h2 class="reader-title">Ideas & Development</h2>
      <p class="reader-intro">Dùng chính các câu Part 3 trong ngân hàng đề làm “idea prompts”. Mỗi câu áp dụng khung Claim → Reason → Example → Perspective và gợi ý ngôn ngữ lấy từ Knowledge Bank.</p>
      ${qs.map((q,i)=>`<article class="reader-card idea-card">
        <div class="small">DISCUSSION PROMPT ${String(i+1).padStart(2,"0")}</div>
        <h3>${this.esc(q)}</h3>
        <div class="framework">
          <div><strong>Claim</strong>Trả lời trực tiếp quan điểm chính.</div>
          <div><strong>Reason</strong>Giải thích vì sao.</div>
          <div><strong>Example</strong>Đưa ví dụ hoặc tình huống.</div>
          <div><strong>Perspective</strong>Mở rộng / điều kiện / mặt còn lại.</div>
        </div>
        <p><b>Useful language:</b> ${[coll[i%Math.max(1,coll.length)]?.term,para[i%Math.max(1,para.length)]?.term,chunks[i%Math.max(1,chunks.length)]?.term].filter(Boolean).map(x=>`<span class="pill">${this.esc(x)}</span>`).join(" ")}</p>
      </article>`).join("")}
    </div>`;
  },

  renderUpgrade(area){
    const tier6=this.mergedTier(6);
    const chunks=this.mergedTier(5).map(x=>this.parseLearningItem(x)).filter(x=>x.term);
    const colls=this.mergedTier(2).map(x=>this.parseLearningItem(x)).filter(x=>x.term);
    const paras=this.mergedTier(4).map(x=>this.parseLearningItem(x)).filter(x=>x.term);

    if(tier6.length){
      let currentLevel="Answer Sentence";
      const rows=[];
      tier6.forEach(o=>{
        const t=o.text.trim();
        if(/^(A2|B1|B2|C1)[–-]/.test(t)||/^(A2|B1|B2|C1)$/.test(t)){
          currentLevel=t;
          return;
        }
        if(/^→/.test(t)){
          if(rows.length) rows[rows.length-1].vi=t.replace(/^→\s*/,"");
          return;
        }
        rows.push({level:currentLevel,en:t,vi:""});
      });
      area.innerHTML=`<div class="reader-section">
        <div class="eyebrow">Speaking Knowledge</div>
        <h2 class="reader-title">Answer Upgrade</h2>
        <p class="reader-intro">Câu tiếng Anh và nghĩa tiếng Việt được đặt chung một thẻ để theo dõi nhanh hơn. Câu tiếng Anh được nhấn mạnh để học viên tập trung vào cách diễn đạt.</p>
        <div class="upgrade-list">
          ${rows.map((r,i)=>`<div class="upgrade-pair">
            <div class="level-label">${this.esc(r.level)}</div>
            <div>
              <div class="upgrade-en">${this.esc(r.en)}</div>
              ${r.vi?`<div class="upgrade-vi">→ ${this.esc(r.vi)}</div>`:""}
            </div>
            <div class="upgrade-audio"><button class="ghost-btn" onclick="app.speak(decodeURIComponent('${encodeURIComponent(r.en)}'))">🔊 Nghe</button></div>
          </div>`).join("")}
        </div>
      </div>`;
      return;
    }

    const get=(a,i)=>a.length?a[i%a.length]?.term:"";
    area.innerHTML=`<div class="reader-section">
      <div class="eyebrow">Speaking Knowledge</div>
      <h2 class="reader-title">Answer Upgrade</h2>
      <p class="reader-intro">Nhóm dữ liệu này chưa có Tầng 6 riêng. Website sử dụng dữ liệu gốc trong Collocations, Paraphrase và Speaking Chunks để tạo khung nâng cấp, không thêm nội dung ngoài nguồn.</p>
      ${Array.from({length:Math.min(12,Math.max(1,chunks.length))},(_,i)=>`
        <article class="reader-card">
          <h3>Upgrade Pattern ${String(i+1).padStart(2,"0")}</h3>
          <div class="level"><div class="level-label">Basic</div><div class="level-text">Trả lời trực tiếp câu hỏi bằng một ý rõ ràng.</div></div>
          <div class="level"><div class="level-label">Natural</div><div class="level-text">Thêm collocation: <b>${this.esc(get(colls,i))}</b></div></div>
          <div class="level"><div class="level-label">Strong</div><div class="level-text">Kết hợp paraphrase / speaking chunk: <b>${this.esc(get(paras,i))}</b> ${get(chunks,i)?`• <b>${this.esc(get(chunks,i))}</b>`:""}</div></div>
        </article>`).join("")}
    </div>`;
  },

  // ---------------- Word practice ----------------
  openWordModal(word){
    this.click();this.currentWord=word.replace(/&#039;/g,"'");
    document.getElementById("wordModalText").textContent=this.currentWord;
    const info=document.getElementById("wordModalInfo");
    const local=this.localIPA(this.currentWord);
    info.textContent=local||"Đang tải IPA…";
    document.getElementById("wordPracticeResult").classList.add("hidden");
    document.getElementById("wordModal").classList.remove("hidden");
    if(!local) this.resolveIPA(this.currentWord,"wordModalInfo");
  },

  closeWordModal(){this.click();document.getElementById("wordModal").classList.add("hidden")},
  speakModalWord(){this.click();this.speak(this.currentWord)},
  practiceModalWord(){
    this.click();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const result=document.getElementById("wordPracticeResult");
    result.classList.remove("hidden");
    if(!SR){result.textContent="Trình duyệt này chưa hỗ trợ Speech Recognition. Bạn vẫn có thể nghe mẫu và tự luyện.";return;}
    try{
      const r=new SR();r.lang="en-GB";r.continuous=false;r.interimResults=false;
      result.textContent="🎤 Đang nghe...";
      r.onresult=e=>{
        const heard=e.results[0][0].transcript.trim().toLowerCase().replace(/[^\p{L}'-]/gu,"");
        const target=this.currentWord.toLowerCase().replace(/[^\p{L}'-]/gu,"");
        result.textContent=heard===target?`✅ Nhận diện đúng: “${e.results[0][0].transcript}”`:`⚠️ Hệ thống nghe được: “${e.results[0][0].transcript}”. Hãy nghe mẫu và thử lại.`;
      };
      r.onerror=()=>result.textContent="Không nhận diện được. Hãy thử lại ở nơi yên tĩnh.";
      r.start();
    }catch(e){result.textContent="Không khởi động được nhận diện giọng nói trên trình duyệt này."}
  },

  stopAll(){
    clearInterval(this.timerId);clearInterval(this.prepTimerId);clearTimeout(this.recognitionRestartTimer);
    this.isRecordingActive=false;this.finishingRecording=false;
    try{speechSynthesis.cancel()}catch(e){}
    try{this.recognition?.abort()}catch(e){}
    this.recognition=null;
    if(this.currentMediaRecorder&&this.currentMediaRecorder.state!=="inactive"){try{this.currentMediaRecorder.stop()}catch(e){}}
    this.mediaStream?.getTracks().forEach(t=>t.stop());
    this.mediaStream=null;this.currentMediaRecorder=null;
  }
};

document.addEventListener("click",e=>{
  if(e.target.tagName==="BUTTON"&&!e.target.closest("#soundToggle")) app.click();
});
window.addEventListener("beforeunload",()=>app.stopAll());
app.init();
</script>
